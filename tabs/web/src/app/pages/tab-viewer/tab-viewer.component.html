<div *ngIf="tab">
  <a [routerLink]="['/song', tab.song_id]" class="muted">← {{ tab.artist }} · {{ tab.song_title }}</a>
  <h1>{{ tab.title || tab.filename }}</h1>
  <p class="muted">
    {{ tab.artist }}<span *ngIf="tab.album"> · {{ tab.album }}</span>
    <span *ngIf="tab.tempo"> · {{ tab.tempo }} bpm</span>
    <span *ngIf="tab.gp_version"> · {{ tab.gp_version }}</span>
    <span *ngIf="tab.measures"> · {{ tab.measures }} bars</span>
    · {{ formatSize(tab.size) }}
  </p>

  <div class="toolbar">
    <button (click)="togglePlay()" class="primary">{{ playing ? 'Pause' : 'Play' }}</button>
    <button (click)="stop()">Stop</button>
    <button (click)="setLoop()" [class.active]="loop">Loop</button>
    <label>Speed
      <input type="range" min="0.5" max="1.5" step="0.1" [value]="speed" (input)="setSpeed($any($event.target).value)" />
      <span class="muted">{{ speed }}x</span>
    </label>
    <label>Track
      <select (change)="selectTrack($any($event.target).value)">
        <option *ngFor="let t of tracks; let i = index" [value]="i" [selected]="i === currentTrack">{{ t.name }}</option>
      </select>
    </label>
  </div>

  <div id="tab-host" class="tab-host"></div>
</div>
