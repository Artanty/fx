<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>L.A. Lady Inspector</title>
<style>
  :root { --bg:#0f1117; --panel:#171a22; --border:#262b38; --text:#d6dae3; --muted:#7c8294; --accent:#4f8cff; --ok:#3ecf6e; --bad:#ff5d5d; --code:#0b0e14; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 "Segoe UI", system-ui, sans-serif; padding:24px; }
  header { display:flex; align-items:baseline; gap:12px; margin-bottom:16px; }
  h1 { font-size:18px; margin:0; }
  h2 { font-size:14px; margin:0 0 10px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .status-pill { font-size:12px; padding:2px 10px; border-radius:99px; }
  .pill-ok { background:rgba(62,207,110,.12); color:var(--ok); border:1px solid rgba(62,207,110,.3); }
  .pill-bad { background:rgba(255,93,93,.12); color:var(--bad); border:1px solid rgba(255,93,93,.3); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(380px,1fr)); gap:16px; }
  .presets { grid-column:1 / -1; }
  .presets table { table-layout:fixed; }
  .presets th:last-child, .presets td:last-child { width:60%; }
  details.datad summary { overflow-wrap:anywhere; }
  details.datad .hexdump { max-height:120px; }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:14px; }
  .kv { display:grid; grid-template-columns:130px 1fr; gap:2px 12px; font-size:13px; }
  .kv dt { color:var(--muted); }
  .kv dd { margin:0; font-family:"Cascadia Mono",Consolas,monospace; word-break:break-all; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--border); vertical-align:top; }
  th { color:var(--muted); font-weight:600; }
  tr.active td { background:rgba(79,140,255,.08); }
  .mono { font-family:"Cascadia Mono",Consolas,monospace; }
  .hexdump { font-family:"Cascadia Mono",Consolas,monospace; font-size:12px; line-height:1.7; word-break:break-all; background:var(--code); border:1px solid var(--border); border-radius:8px; padding:10px; max-height:420px; overflow:auto; white-space:pre-wrap; }
  .tag { font-size:11px; padding:1px 7px; border-radius:5px; background:var(--border); color:var(--text); }
  .tag.usr { background:rgba(62,207,110,.15); color:var(--ok); }
  .tag.sel { background:rgba(255,190,80,.15); color:#ffbe50; }
  .tag.act { background:rgba(79,140,255,.15); color:var(--accent); }
  .muted { color:var(--muted); }
  .err { color:var(--bad); padding:8px 0; }
  .refresh { margin-left:auto; color:var(--muted); font-size:12px; }
  button { background:var(--border); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:4px 10px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  .btnlink { display:inline-block; font-size:11.5px; text-decoration:none; color:var(--accent); border:1px solid var(--border); border-radius:6px; padding:3px 8px; margin-right:4px; }
  .btnlink:hover { border-color:var(--accent); background:rgba(79,140,255,.08); }
  .nowrap { white-space:nowrap; }
  .wctl { display:flex; flex-direction:column; gap:4px; align-items:flex-start; }
  .preFile { width:150px; font-size:11px; color:var(--muted); }
  .wres { font-size:11px; }
  details { border:1px solid var(--border); border-radius:8px; padding:8px 10px; margin-top:6px; }
  summary { cursor:pointer; color:var(--accent); font-size:12.5px; }
</style>
</head>
<body>
<header>
  <h1>L.A. Lady Inspector</h1>
  <span id="pill" class="status-pill pill-bad">offline</span>
  <span class="refresh" id="lastUpdate"></span>
  <button id="refreshBtn" title="Read from the pedal once">Refresh</button>
</header>

<div class="grid">
  <section class="panel">
    <h2>Device / Status</h2>
    <div id="status"><div class="err">Scanning…</div></div>
  </section>

  <section class="panel presets">
    <h2>Presets (onboard flash)</h2>
    <div id="presets"><div class="err">Scanning…</div></div>
  </section>

  <section class="panel">
    <h2>EEPROM / MIDI Map</h2>
    <div id="eeprom"><div class="err">Scanning…</div></div>
  </section>

  <section class="panel">
    <h2>Backup reference (.osbf)</h2>
    <div id="osbf"><div class="err">Scanning…</div></div>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function pill(ok, text) {
  const p = $('pill');
  p.className = 'status-pill ' + (ok ? 'pill-ok' : 'pill-bad');
  p.textContent = text;
}

async function refresh() {
  let all;
  try {
    const r = await fetch('/api/all?fresh=1');
    all = await r.json();
  } catch (e) {
    pill(false, 'server unreachable');
    return;
  }
  if (all.error) {
    pill(false, 'offline');
    $('status').innerHTML = '<div class="err">' + esc(all.error) + '</div><div class="muted">' + esc((all.devices||[]).join('<br>')) + '</div>';
    return;
  }
  pill(true, 'online');
  $('lastUpdate').textContent = 'updated ' + new Date().toLocaleTimeString();

  const c = all.config;
  $('status').innerHTML = `
    <dl class="kv">
      <dt>model</dt><dd>${esc(c.deviceModel)} (L.A. Lady)</dd>
      <dt>firmware</dt><dd>${esc(c.firmwareVersion)}</dd>
      <dt>active preset</dt><dd>${esc(c.activePreset)} → page ${all.presets.activePage.toString(16)}</dd>
      <dt>midi channel</dt><dd>${esc(c.midiChannel)} (0-based)</dd>
      <dt>bypass mode</dt><dd>${esc(c.hardwareBypassMode)}</dd>
      <dt>device</dt><dd>${esc(all.device.product)} (pid ${all.device.productId.toString(16)})</dd>
    </dl>
    <details><summary>raw config</summary><pre class="mono" style="font-size:11px">${esc(c.raw)}</pre></details>`;

  const slots = all.presets.slots.map(s => {
    const tags = [];
    if (s.page === all.presets.activePage) tags.push('<span class="tag act">ACTIVE</span>');
    if (s.kind.startsWith('USER_PRESET')) tags.push('<span class="tag usr">' + esc(s.kind.replace('USER_PRESET ','backup #')) + '</span>');
    else if (s.kind.startsWith('SELECTOR')) tags.push('<span class="tag sel">' + esc(s.kind) + '</span>');
    const rows = s.rows.map(r =>
      '<tr><td class="mono muted">0x' + r.offset.toString(16).padStart(2,'0') + '</td>' +
      '<td class="mono">' + r.hex + '</td><td class="mono muted">' + r.ascii + '</td><td class="muted">' + r.region + '</td></tr>').join('');
    const mRef = s.kind.match(/^(USER_PRESET|SELECTOR) (\d)$/);
    const refId = mRef ? (mRef[1][0] === 'U' ? 'UP' : 'US') + mRef[2] : null;
    const backup = (refId ? '<a class="btnlink" title="from .osbf (no pedal contact)" href="/api/export-ref?id=' + refId + '">ref</a> ' : '') +
      '<a class="btnlink" title="read from pedal once" href="/api/export?slot=' + s.page.toString(16) + '">backup .pre</a>';
    const slotHex = s.page.toString(16);
    const writeCell =
      '<div class="wctl">' +
      '<input type="file" accept=".pre,application/xml,text/xml" class="preFile" data-slot="0x' + slotHex + '" title="Neuro .pre to write into this slot">' +
      '<button class="btnlink doWrite" data-slot="0x' + slotHex + '">Write</button>' +
      '<button class="btnlink doActivate" data-slot="0x' + slotHex + '">Activate</button>' +
      '<input type="number" class="wIdx" data-slot="0x' + slotHex + '" min="0" max="127" placeholder="erase idx" title="preset index to erase (optional; defaults to page mapping)">' +
      '<input type="number" class="aIdx" data-slot="0x' + slotHex + '" min="0" max="127" placeholder="act idx" title="active-preset index (optional)">' +
      '<span class="wres" data-slot="0x' + slotHex + '"></span></div>';
    return '<tr class="' + (s.page === all.presets.activePage ? 'active' : '') + '">' +
      '<td class="mono">' + esc(s.name || '(unnamed)') + '</td>' +
      '<td class="mono muted">' + slotHex + '</td>' +
      '<td>' + tags.join(' ') + '</td>' +
      '<td><details class="datad"><summary>${esc(s.hex.slice(0, 24))}… <span class="muted">(${s.hex.length / 2} B)</span></summary><div class="hexdump">${esc(s.hex)}</div><table>' + rows + '</table></details></td>' +
      '<td class="nowrap">' + backup + '</td>' +
      '<td class="nowrap">' + writeCell + '</td></tr>';
  }).join('');

    $('presets').innerHTML = '<table><tr><th>name</th><th>page</th><th>source</th><th>data</th><th>backup</th><th>write</th></tr>' + slots + '</table>';
  const mm = all.eeprom.midiMap;
  $('eeprom').innerHTML = `
    <dl class="kv">
      <dt>vs .osbf</dt><dd>${all.eeprom.osbfMatch ? 'match' : esc(all.eeprom.osbfDiffCount + ' diff, offsets ' + all.eeprom.osbfDiffOffsets.join(','))}</dd>
      <dt>midi map</dt><dd>${mm.length ? mm.map(m => 'CC ' + m.cc + ' @ pos ' + m.position).join(', ') : 'none configured'}</dd>
    </dl>
    <details><summary>256-byte dump</summary><div class="hexdump">${esc(all.eeprom.hex.match(/.{1,2}/g).map((b,i)=>b).join(' '))}</div></details>`;

  const ob = all.osbf;
  $('osbf').innerHTML = `
    <dl class="kv"><dt>product id</dt><dd>${esc(ob.productId)}</dd></dl>
    <table><tr><th>#</th><th>name</th></tr>
    ${ob.presets.map(x => '<tr><td class="mono muted">' + esc(x.location) + '</td><td>' + esc(x.name) + '</td></tr>').join('')}
    ${ob.selectors.map(x => '<tr><td class="mono muted">' + esc(x.location) + '</td><td class="muted">' + esc(x.name) + ' (selector)</td></tr>').join('')}
    </table>`;
}

refresh();
$('refreshBtn').addEventListener('click', () => {
  $('lastUpdate').textContent = 'refreshing…';
  refresh();
});

const resOf = slot => document.querySelector('.wres[data-slot="' + slot + '"]');

async function doWrite(slot) {
  const fi = document.querySelector('.preFile[data-slot="' + slot + '"]');
  const out = resOf(slot);
  if (!fi || !fi.files.length) { out.textContent = 'choose a .pre first'; out.style.color = 'var(--bad)'; return; }
  const idxEl = document.querySelector('.wIdx[data-slot="' + slot + '"]');
  const idx = idxEl && idxEl.value !== '' ? parseInt(idxEl.value, 10) : undefined;
  out.textContent = 'writing…'; out.style.color = 'var(--muted)';
  try {
    const text = await fi.files[0].text();
    const r = await fetch('/api/write', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ slot, preText: text, idx }) });
    const j = await r.json();
    if (!r.ok) { out.textContent = 'err: ' + (j.error || r.status); out.style.color = 'var(--bad)'; }
    else { out.textContent = 'ok ✓ (verify + refresh)'; out.style.color = 'var(--ok)'; }
  } catch (e) { out.textContent = 'err ' + e.message; out.style.color = 'var(--bad)'; }
}

async function doActivate(slot) {
  const out = resOf(slot);
  const idxEl = document.querySelector('.aIdx[data-slot="' + slot + '"]');
  const idx = idxEl && idxEl.value !== '' ? parseInt(idxEl.value, 10) : undefined;
  out.textContent = 'activating…'; out.style.color = 'var(--muted)';
  try {
    const r = await fetch('/api/activate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ slot, idx }) });
    const j = await r.json();
    if (!r.ok) { out.textContent = 'err: ' + (j.error || r.status); out.style.color = 'var(--bad)'; }
    else { out.textContent = 'active ✓'; out.style.color = 'var(--ok)'; }
  } catch (e) { out.textContent = 'err ' + e.message; out.style.color = 'var(--bad)'; }
}

document.addEventListener('click', e => {
  const w = e.target.closest('.doWrite');
  if (w) { doWrite(w.dataset.slot); return; }
  const a = e.target.closest('.doActivate');
  if (a) { doActivate(a.dataset.slot); return; }
});
</script>
</body>
</html>
